# Read the Docs: builds the Sphinx docs on every push to main (and on every pull request, as a preview) and serves
# them at https://perturbgen.readthedocs.io/.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    - libopenmpi-dev  # mpi4py
  jobs:
    install:
      # The package's pins without the CUDA wheels: the torch wheels alone from the PyTorch CPU index, everything else
      # (torch's own dependencies included) from PyPI only (docs/rtd_requirements.py). docs/conf.py imports perturbgen
      # from the checkout, so the package itself is not installed.
      - pip install -U pip
      - python docs/rtd_requirements.py torch > "${READTHEDOCS_VIRTUALENV_PATH}/rtd-torch.txt"
      - python docs/rtd_requirements.py > "${READTHEDOCS_VIRTUALENV_PATH}/rtd-requirements.txt"
      - pip install --no-deps --index-url https://download.pytorch.org/whl/cpu -r "${READTHEDOCS_VIRTUALENV_PATH}/rtd-torch.txt"
      - pip install -r "${READTHEDOCS_VIRTUALENV_PATH}/rtd-requirements.txt" -r docs/requirements.txt
      - python -c "import torch; assert torch.version.cuda is None, torch.__version__"  # fails on a CUDA build of torch (no single quotes: RTD wraps each command in them)

sphinx:
  configuration: docs/conf.py
