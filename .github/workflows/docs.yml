name: Docs

# Builds the Sphinx docs on every PR and push to main, with the same install steps as Read the Docs
# (.readthedocs.yaml), so a green check here means the hosted build will work too. Read the Docs builds and
# serves https://perturbgen.readthedocs.io/ itself on every push to main; nothing is deployed from here.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'perturbgen/**', 'pyproject.toml', '.readthedocs.yaml', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'perturbgen/**', 'pyproject.toml', '.readthedocs.yaml', '.github/workflows/docs.yml']
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev

      - name: Install the dependencies (CPU torch, no CUDA wheels) and the docs toolchain
        run: |
          pip install -U pip
          python docs/rtd_requirements.py torch > "$RUNNER_TEMP/rtd-torch.txt"
          python docs/rtd_requirements.py > "$RUNNER_TEMP/rtd-requirements.txt"
          pip install --no-deps --index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/rtd-torch.txt"
          pip install -r "$RUNNER_TEMP/rtd-requirements.txt" -r docs/requirements.txt
          python -c "import torch; assert torch.version.cuda is None, torch.__version__"  # fails on a CUDA build of torch

      - name: Build HTML
        run: make -C docs html
