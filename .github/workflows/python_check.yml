name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'
    - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev
    - run: pip install -U pip setuptools wheel
    - run: pip install -r requirements.txt
    - run: pip install -e .
    - run: pip install flake8 mypy pydocstyle

    # Lint is informational for now: the existing code has many style findings, so these
    # steps report them without failing the check.
    - name: Run Flake8
      continue-on-error: true
      run: |
        flake8 --max-line-length=88 --extend-ignore=E203 --exclude="*_nb.py" perturbgen
    - name: Run MyPy
      continue-on-error: true
      run: |
        mypy --ignore-missing-imports --scripts-are-modules --follow-imports=skip --exclude=_nb\.py perturbgen
    - name: Run Pydocstyle
      continue-on-error: true
      run: |
        pydocstyle --ignore-decorators=property --match='((?!_nb).)*\.py' perturbgen
